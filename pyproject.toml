[project]
name = "gee-downloader"
version = "0.1.0"
description = "Download satellite imagery using Earth Engine, GCLD, STAC, or CDSE"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Debian Bookworm's GDAL bindings require NumPy 1.x.
    "numpy>=1.24,<2",
    "rasterio>=1.4",
    "geopandas>=1.0",
    "pendulum>=3.0",
    "plumbum>=1.9",
    "earthengine-api>=1.5",
    "PyYAML>=6.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "tqdm>=4.0",
    "netCDF4>=1.7",
    "pyproj>=3.6",
    "requests>=2.28",
    "esa-snappy>=1.1",
    "gsutil>=5.37",
]

[tool.uv]
package = false
